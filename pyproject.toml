[project]
name = "python-lambda-turso-template"
version = "0.1.0"
description = "Plantilla desacoplada para AWS Lambda con API Gateway HTTP API y Turso Serverless"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-lambda-powertools>=3.0.0",
    "pydantic>=2.7.0",
    "turso-serverless>=0.0.1",
]

[dependency-groups]
dev = [
    "boto3>=1.34.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]

line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
