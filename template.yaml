AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Plantilla AWS SAM para Lambda en Python 3.13 desacoplada
  con API Gateway HTTP API (v2) y base de datos Turso Serverless.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.13
    Architectures:
      - arm64
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: turso-api-service
        LOG_LEVEL: INFO
        TURSO_SECRET_NAME: prod/turso/credentials

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - '*'

  TursoApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.main.lambda_handler
      Description: API Serverless conectada a Turso con arquitectura en capas
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:prod/turso/credentials*"
      Events:
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

Outputs:
  HttpApiUrl:
    Description: URL base de la HTTP API desplegada
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TursoApiFunctionArn:
    Description: ARN de la función Lambda
    Value: !GetAtt TursoApiFunction.Arn
