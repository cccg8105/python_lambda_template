AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Plantilla AWS SAM para Lambda en Python 3.13 desacoplada
  con API Gateway HTTP API (v2) y base de datos Turso Serverless.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Entorno de despliegue (dev, staging, prod)
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Nivel de logging para Powertools
  TursoSecretName:
    Type: String
    Default: dev/turso/credentials
    Description: Nombre del secreto en AWS Secrets Manager para Turso

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.13
    Architectures:
      - arm64
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: !Sub "turso-api-${Environment}"
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        TURSO_SECRET_NAME: !Ref TursoSecretName
    Tags:
      Environment: !Ref Environment
      Project: python_lambda_template
      ManagedBy: AWS-SAM

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - '*'

  TursoApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.main.lambda_handler
      Description: !Sub "API Serverless conectada a Turso (${Environment})"
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${TursoSecretName}*"
      Events:
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

Outputs:
  HttpApiUrl:
    Description: URL base de la HTTP API desplegada
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  TursoApiFunctionArn:
    Description: ARN de la función Lambda
    Value: !GetAtt TursoApiFunction.Arn
  EnvironmentDeployed:
    Description: Entorno desplegado
    Value: !Ref Environment
